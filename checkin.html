<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>98GO 電動車｜交車確認（維護中）</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{
  --brand:#2B2D42;--accent:#E63946;--amber:#854F0B;--amber-soft:#FFF3E5;
  --gray1:#f8f8f8;--gray3:#e0e0e0;--gray5:#666;--text:#1a1a1a;
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--gray1);color:var(--text);min-height:100vh;}
.header{background:var(--brand);color:#fff;padding:1.25rem 1.5rem;display:flex;align-items:center;gap:14px;box-shadow:0 2px 16px rgba(0,0,0,0.18);}
.logo-mark{width:40px;height:40px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;flex-shrink:0;}
.logo-mark span:first-child{font-size:13px;font-weight:900;color:#fff;line-height:1;}
.logo-mark span:last-child{font-size:8px;color:rgba(255,255,255,.85);letter-spacing:.1em;}
.header-text h1{font-size:17px;font-weight:700;}
.header-text p{font-size:12px;opacity:.65;margin-top:1px;}
.container{max-width:520px;margin:3rem auto;padding:0 1.25rem;}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:2rem 1.75rem;text-align:center;}
.icon{width:64px;height:64px;background:var(--amber-soft);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 1.25rem;}
.card h2{font-size:19px;font-weight:700;color:var(--brand);margin-bottom:.75rem;}
.card p{font-size:14px;color:var(--gray5);line-height:1.8;margin-bottom:.5rem;}
.notice{background:var(--amber-soft);border:1.5px solid #F4A261;border-radius:8px;padding:1rem 1.25rem;margin-top:1.25rem;text-align:left;font-size:13px;color:var(--amber);line-height:1.8;}
.notice strong{display:block;margin-bottom:4px;}
</style>
</head>
<body>
<div class="header">
  <div class="logo-mark"><span>98GO</span><span>e-bike</span></div>
  <div class="header-text"><h1>交車確認</h1><p>門市人員操作</p></div>
</div>
<div class="container">
  <div class="card">
    <div class="icon">🛠️</div>
    <h2>系統維護中</h2>
    <p>交車確認頁暫停使用，正在進行安全性更新。</p>
    <p>造成不便敬請見諒，恢復時間另行通知。</p>
    <div class="notice">
      <strong>維護期間請改用：</strong>
      改用銷售報表（report.html）查詢訂單資料，或以電話／LINE 與客戶及門市確認交車細節，待系統恢復後再補登記。
    </div>
  </div>
</div>
</body>
</html>
