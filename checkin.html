<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>98GO 電動車｜交車確認</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{
  --brand:#2B2D42;--accent:#E63946;--green:#1D9E75;--green-soft:#E1F5EE;
  --blue:#185FA5;--blue-soft:#E6F1FB;--amber:#854F0B;--amber-soft:#FFF3E5;
  --gray1:#f8f8f8;--gray2:#f0f0f0;--gray3:#e0e0e0;--gray4:#aaa;--gray5:#666;
  --text:#1a1a1a;--radius:10px;--radius-sm:6px;--shadow:0 2px 12px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--gray1);color:var(--text);min-height:100vh;padding-bottom:3rem;}
.header{background:var(--brand);color:#fff;padding:1.25rem 1.5rem;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.18);}
.logo-mark{width:40px;height:40px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;flex-shrink:0;}
.logo-mark span:first-child{font-size:13px;font-weight:900;color:#fff;line-height:1;}
.logo-mark span:last-child{font-size:8px;color:rgba(255,255,255,.85);letter-spacing:.1em;}
.header-text h1{font-size:17px;font-weight:700;}
.header-text p{font-size:12px;opacity:.65;margin-top:1px;}
.steps{background:#fff;border-bottom:1px solid var(--gray3);padding:.875rem 1.5rem;display:flex;align-items:center;justify-content:center;gap:0;}
.step-item{display:flex;align-items:center;gap:6px;}
.step-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--gray3);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gray4);flex-shrink:0;transition:all .3s;}
.step-dot.active{background:var(--brand);border-color:var(--brand);color:#fff;}
.step-dot.done{background:var(--green);border-color:var(--green);color:#fff;}
.step-label{font-size:11px;color:var(--gray4);font-weight:500;white-space:nowrap;}
.step-label.active{color:var(--brand);font-weight:700;}
.step-label.done{color:var(--green);}
.step-line{width:28px;height:2px;background:var(--gray3);margin:0 4px;transition:background .3s;flex-shrink:0;}
.step-line.done{background:var(--green);}
.container{max-width:640px;margin:1.5rem auto;padding:0 1rem;}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:1.5rem;margin-bottom:1rem;}
.card-title{font-size:15px;font-weight:700;color:var(--brand);margin-bottom:1.25rem;padding-bottom:.625rem;border-bottom:2px solid var(--gray2);display:flex;align-items:center;gap:8px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field label{font-size:12px;font-weight:600;color:var(--gray5);}
.field input,.field select{padding:11px 14px;border:1.5px solid var(--gray3);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;color:var(--text);background:#fff;transition:border-color .2s;width:100%;}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(43,45,66,.08);}
.field .hint{font-size:11px;color:var(--gray4);margin-top:2px;}
.field .req{color:var(--accent);margin-left:2px;}
.order-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--gray2);}
.order-row:last-child{border-bottom:none;}
.order-row .lbl{color:var(--gray5);}
.order-row .val{font-weight:600;color:var(--brand);text-align:right;}
.balance-display{background:var(--amber-soft);border:2px solid #F4A261;border-radius:var(--radius);padding:1.25rem;text-align:center;margin-bottom:1rem;}
.balance-display .lbl{font-size:12px;color:var(--amber);font-weight:600;margin-bottom:4px;}
.balance-display .amount{font-size:40px;font-weight:900;color:var(--amber);line-height:1;}
.balance-display .sub{font-size:11px;color:var(--amber);opacity:.8;margin-top:6px;}
.balance-zero{background:var(--green-soft);border:2px solid #9FE1CB;border-radius:var(--radius);padding:1rem;text-align:center;margin-bottom:1rem;color:var(--green);font-weight:700;font-size:14px;}
.addon-list{background:var(--blue-soft);border:1.5px solid #B5D4F4;border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1rem;}
.addon-list-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:.75rem;}
.addon-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(24,95,165,0.1);}
.addon-item:last-child{border-bottom:none;}
.addon-item .name{color:var(--brand);}
.addon-item .price{font-weight:600;color:var(--blue);}
.addon-total{display:flex;justify-content:flex-end;font-size:13px;font-weight:700;color:var(--blue);padding-top:8px;margin-top:4px;border-top:1px solid #B5D4F4;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.grid2{grid-template-columns:1fr;}}
.payment-section{background:var(--gray1);border-radius:var(--radius-sm);padding:1rem;margin-bottom:1rem;}
.payment-section-title{font-size:12px;font-weight:700;color:var(--gray5);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.05em;}
.btn-primary{width:100%;padding:14px;background:var(--brand);color:#fff;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s;margin-top:.5rem;}
.btn-primary:hover{background:#1a1c2e;}
.btn-primary:disabled{background:var(--gray3);cursor:not-allowed;}
.btn-green{background:var(--green);}
.btn-green:hover{background:#178a65;}
.btn-back{width:100%;padding:11px;background:#fff;color:var(--gray5);border:1.5px solid var(--gray3);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;cursor:pointer;margin-top:.5rem;}
.err-msg{background:#fff0f1;border:1px solid #F5C4B3;border-radius:var(--radius-sm);padding:.75rem 1rem;font-size:13px;color:#A32D2D;margin-top:.75rem;display:none;}
.err-msg.show{display:block;}
.spinner-wrap{text-align:center;padding:1rem;color:var(--gray5);font-size:13px;display:none;}
.spinner-wrap.show{display:block;}
.spinner{width:28px;height:28px;border:3px solid var(--gray2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .5rem;}
@keyframes spin{to{transform:rotate(360deg);}}
/* ====== 多筆尾款付款明細 ====== */
.bal-detail-hdr{display:grid;grid-template-columns:1fr 90px 130px 30px;gap:6px;margin-bottom:3px;}
.bal-detail-hdr span{font-size:10px;color:var(--gray4);font-weight:600;letter-spacing:.03em;}
.bal-detail-row{display:grid;grid-template-columns:1fr 90px 130px 30px;gap:6px;align-items:center;margin-bottom:7px;}
.bal-detail-row select,.bal-detail-row input[type=number],.bal-detail-row input[type=date]{
  padding:9px 10px;border:1.5px solid var(--gray3);border-radius:var(--radius-sm);
  font-size:14px;font-family:inherit;color:var(--text);background:#fff;width:100%;
}
.bal-detail-row input[type=number]{text-align:right;}
.bal-detail-row select:focus,.bal-detail-row input:focus{outline:none;border-color:var(--brand);}
.bal-row-remove{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--gray3);background:#fff;color:var(--gray4);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.bal-row-remove:hover{background:#FCEBEB;border-color:#F09595;color:#A32D2D;}
.btn-add-bal{font-size:12px;padding:6px 14px;border-radius:var(--radius-sm);border:1.5px dashed #B5D4F4;background:#E6F1FB;color:#185FA5;cursor:pointer;font-family:inherit;font-weight:600;margin-top:4px;width:100%;}
.btn-add-bal:hover{background:#185FA5;color:#fff;border-color:#185FA5;}
.bal-sum-row{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:6px;font-size:12px;}
.bal-sum-ok{color:var(--green);font-weight:700;}
.bal-sum-err{color:var(--accent);font-weight:700;}
@media(max-width:480px){
  .bal-detail-hdr{grid-template-columns:1fr 80px 30px;}
  .bal-detail-hdr .bal-date-lbl{display:none;}
  .bal-detail-row{grid-template-columns:1fr 80px 30px;}
  .bal-detail-row input[type=date]{display:none;}
}
#done-screen{display:none;text-align:center;padding:1rem 0;}
.done-icon{width:80px;height:80px;background:var(--green-soft);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 1.25rem;}
.done-title{font-size:22px;font-weight:700;color:var(--brand);margin-bottom:.5rem;}
.done-sub{font-size:14px;color:var(--gray5);line-height:1.7;margin-bottom:1.25rem;}
.done-info{background:var(--green-soft);border-radius:var(--radius);padding:1rem 1.25rem;text-align:left;}
.done-info-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(0,0,0,0.05);}
.done-info-row:last-child{border-bottom:none;}
.done-info-row .lbl{color:var(--gray5);}
.done-info-row .val{font-weight:600;color:var(--brand);}
.period-row{display:none;margin-top:8px;}
</style>
</head>
<body>
<div class="header">
  <div class="logo-mark"><span>98GO</span><span>e-bike</span></div>
  <div class="header-text"><h1>交車確認</h1><p>門市人員操作｜一頁完成交車登記</p></div>
</div>
<div class="steps">
  <div class="step-item"><div class="step-dot active" id="dot1">1</div><div class="step-label active" id="lbl1">查詢訂單</div></div>
  <div class="step-line" id="line1"></div>
  <div class="step-item"><div class="step-dot" id="dot2">2</div><div class="step-label" id="lbl2">確認 + 登記</div></div>
  <div class="step-line" id="line2"></div>
  <div class="step-item"><div class="step-dot" id="dot3">3</div><div class="step-label" id="lbl3">完成</div></div>
</div>
<div class="container">

  <!-- STEP 1 -->
  <div id="step1">
    <div class="card">
      <div class="card-title">🔍 查詢訂單</div>
      <div style="background:#E6F1FB;border-radius:6px;padding:.6rem 1rem;margin-bottom:1.25rem;font-size:12px;color:#185FA5;line-height:1.6;">
        📋 輸入訂單單號查詢交車資料
      </div>
      <div class="field">
        <label>訂單單號</label>
        <input type="text" id="f-id" placeholder="例：260419-1452" autocomplete="off"
          onkeydown="if(event.key==='Enter')queryOrder()">
      </div>
      <div class="err-msg" id="err1"></div>
      <div class="spinner-wrap" id="loading1"><div class="spinner"></div>查詢中...</div>
      <button class="btn-primary" onclick="queryOrder()">🔍 查詢訂單</button>
    </div>
  </div>

  <!-- STEP 2 -->
  <div id="step2" style="display:none;">

    <!-- 尾款大字 -->
    <div id="balance-section"></div>

    <!-- 加購清單 -->
    <div id="addon-section" style="display:none;">
      <div class="addon-list">
        <div class="addon-list-title">🛍 加購項目確認清單</div>
        <div id="addon-list"></div>
        <div id="addon-total-row" class="addon-total" style="display:none;">加購合計：<span id="addon-total-val"></span></div>
      </div>
    </div>

    <!-- 訂單資料 -->
    <div class="card">
      <div class="card-title">📋 訂單資料</div>
      <div id="order-info"></div>
    </div>

    <!-- 收款登記（整合在此） -->
    <div class="card">
      <div class="card-title">💰 收款登記</div>

      <div class="grid2">
        <div class="field">
          <label>車架號碼 <span class="req">*</span></label>
          <input type="text" id="d-frame" placeholder="請輸入車架號碼" autocomplete="off">
          <div class="hint" id="d-frame-hint"></div>
        </div>
        <div class="field">
          <label>馬達編號 <span style="color:var(--gray4);font-weight:400;">（選填）</span></label>
          <input type="text" id="d-motor" placeholder="請輸入馬達編號" autocomplete="off">
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label>車牌號碼 <span style="color:var(--gray4);font-weight:400;">（選填）</span></label>
          <input type="text" id="d-plate" placeholder="例：ABC-1234" autocomplete="off">
          <div class="hint" id="d-plate-hint"></div>
        </div>
        <div class="field">
          <label>實際交車日 <span class="req">*</span></label>
          <input type="date" id="d-delivery-date">
          <div class="hint">預設今天，可手動修改</div>
        </div>
      </div>

      <div id="bal-section">
        <div class="payment-section">
          <div class="payment-section-title">尾款收款明細</div>
          <div class="bal-detail-hdr">
            <span>付款方式</span><span>金額</span><span class="bal-date-lbl">收款日期</span><span></span>
          </div>
          <div id="bal-detail-list"></div>
          <button type="button" class="btn-add-bal" onclick="addBalRow()">＋ 新增付款方式</button>
          <div class="bal-sum-row" id="bal-sum-row" style="display:none;">
            加總：<span id="bal-sum-val">NT$ 0</span>
            ／ 尾款 <span id="bal-target-val">NT$ 0</span>
            <span id="bal-sum-status"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="err-msg" id="err2"></div>
    <button class="btn-primary btn-green" onclick="confirmDelivery()">✅ 確認交車完成</button>
    <button class="btn-back" onclick="goBack()">← 返回查詢</button>
  </div>

  <!-- STEP 3 完成 -->
  <div id="done-screen">
    <div class="card">
      <div class="done-icon">✅</div>
      <div class="done-title">交車完成！</div>
      <div class="done-sub">訂單已更新為「已交車」，收款資料已同步登記 🎉</div>
      <div class="done-info" id="done-info"></div>
      <button class="btn-back" style="margin-top:1rem;" onclick="location.reload()">← 查詢下一筆</button>
    </div>
  </div>

</div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyf7HAMbgsauGk4zIyrrm7jNuo-vjj7l-E8qk8tG4toCfNCjfTSMaJd_odqrqUFq1VG/exec';
let orderData=null;

function fmtMoney(n){return 'NT$ '+Math.round(parseFloat(n)||0).toLocaleString();}
function setStep(n){
  [1,2,3].forEach(i=>{
    document.getElementById('dot'+i).className='step-dot'+(i<n?' done':i===n?' active':'');
    document.getElementById('lbl'+i).className='step-label'+(i<n?' done':i===n?' active':'');
  });
  [1,2].forEach(i=>{document.getElementById('line'+i).className='step-line'+(i<n?' done':'');});
}
function showErr(id,msg){const el=document.getElementById(id);el.textContent=msg;el.classList.add('show');}
function hideErr(id){document.getElementById(id).classList.remove('show');}

// ====== 多筆尾款付款明細 ======
const BAL_METHODS=['現金','匯款/轉帳','信用卡','無卡分期','蝦皮','官網','其他'];
function _balOpts(sel){return '<option value="">請選擇</option>'+BAL_METHODS.map(m=>`<option value="${m}"${m===sel?' selected':''}>${m}</option>`).join('');}
let _balRowId=0;

function addBalRow(method,amount,date){
  _balRowId++;
  const id=_balRowId;
  const today=new Date().toISOString().split('T')[0];
  const div=document.createElement('div');
  div.className='bal-detail-row'; div.id='bal-r-'+id;
  div.innerHTML=
    `<select onchange="calcBalSum()">${_balOpts(method||'')}</select>`+
    `<input type="number" placeholder="金額" min="0" value="${amount||''}" oninput="calcBalSum()" style="text-align:right;">`+
    `<input type="date" value="${date||today}" onchange="calcBalSum()">`+
    `<button type="button" class="bal-row-remove" onclick="removeBalRow(${id})">×</button>`;
  document.getElementById('bal-detail-list').appendChild(div);
  calcBalSum();
}

function removeBalRow(id){
  const el=document.getElementById('bal-r-'+id);
  if(el) el.remove();
  calcBalSum();
}

function getBalDetails(){
  const rows=document.querySelectorAll('#bal-detail-list .bal-detail-row');
  const result=[];
  rows.forEach(row=>{
    const method=row.querySelector('select').value;
    const amount=parseFloat(row.querySelector('input[type=number]').value)||0;
    const date=row.querySelector('input[type=date]').value;
    result.push({method,amount,date});
  });
  return result;
}

function calcBalSum(){
  const details=getBalDetails().filter(d=>d.amount>0);
  const target=parseFloat(orderData?.balance)||0;
  const sumRow=document.getElementById('bal-sum-row');
  if(details.length===0||target===0){sumRow.style.display='none';return;}
  const sum=details.reduce((s,d)=>s+d.amount,0);
  document.getElementById('bal-sum-val').textContent='NT$ '+Math.round(sum).toLocaleString();
  document.getElementById('bal-target-val').textContent='NT$ '+Math.round(target).toLocaleString();
  const status=document.getElementById('bal-sum-status');
  const ok=Math.abs(sum-target)<1;
  status.textContent=ok?'✅':'⚠️ 不符'; status.className=ok?'bal-sum-ok':'bal-sum-err';
  sumRow.style.display='flex';
}

// 預填今天日期（收款登記區日期改在每筆明細填）
// document.getElementById('d-date') 已移除，改由各列日期欄位管理

function queryOrder(){
  hideErr('err1');
  const id=document.getElementById('f-id').value.trim();
  if(!id) return showErr('err1','請填寫訂單單號');
  document.getElementById('loading1').classList.add('show');
  const cbName='cb_'+Date.now();
  window[cbName]=function(data){
    document.getElementById('loading1').classList.remove('show');
    delete window[cbName]; script.remove();
    if(data.status==='notfound'||data.status==='not_found') return showErr('err1','找不到訂單，請確認單號是否正確');
    if(data.status==='error') return showErr('err1','查詢失敗：'+(data.message||'請稍後再試'));
    if(data.orderStatus==='已交車') return showErr('err1','此訂單已完成交車');
    orderData={...data,id};
    showStep2(data);
  };
  const script=document.createElement('script');
  script.src=`${SCRIPT_URL}?action=receipt&orderId=${encodeURIComponent(id)}&callback=${cbName}`;
  script.onerror=()=>{document.getElementById('loading1').classList.remove('show');showErr('err1','網路異常，請稍後再試');};
  document.body.appendChild(script);
  setTimeout(()=>{if(window[cbName]){document.getElementById('loading1').classList.remove('show');delete window[cbName];script.remove();showErr('err1','查詢逾時，請稍後再試');}},10000);
}

function showStep2(data){
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  setStep(2);
  window.scrollTo({top:0,behavior:'smooth'});

  // 實際交車日預設今天
  document.getElementById('d-delivery-date').value = new Date().toISOString().split('T')[0];

  // 自動帶入既有的車架號碼／馬達編號／車牌號碼（若訂單助手或先前流程已登記過）
  // 門市仍可直接在欄位內修正，不要求重複輸入
  document.getElementById('d-frame').value = data.frame || '';
  document.getElementById('d-motor').value = data.motor || '';
  document.getElementById('d-plate').value = data.plate || '';
  document.getElementById('d-frame-hint').textContent = data.frame ? '已自動帶入既有資料，如有誤可直接修正' : '';
  document.getElementById('d-plate-hint').textContent = data.plate ? '已自動帶入既有資料，如有誤可直接修正' : '';

  const bal=parseFloat(data.balance)||0;
  const balSection=document.getElementById('balance-section');
  if(bal>0){
    balSection.innerHTML=`<div class="balance-display">
      <div class="lbl">⚠️ 應收尾款金額</div>
      <div class="amount">${fmtMoney(bal)}</div>
      <div class="sub">請向客人收款後再完成交車</div>
    </div>`;
    document.getElementById('bal-section').style.display='';
    // 自動帶入一筆，金額預填尾款全額
    addBalRow('',bal,new Date().toISOString().split('T')[0]);
  } else {
    balSection.innerHTML=`<div class="balance-zero">✅ 此訂單已完款，無需收取尾款</div>`;
    document.getElementById('bal-section').style.display='none';
  }

  if(data.addonItems){
    const items=data.addonItems.split('、').filter(Boolean);
    if(items.length>0){
      document.getElementById('addon-section').style.display='';
      let html='';
      items.forEach(i=>{
        const parts=i.split(':');
        const name=parts[0].trim();
        const price=parts[1]?parseFloat(parts[1]):null;
        html+=`<div class="addon-item"><span class="name">✓ ${name}</span>${price?`<span class="price">${fmtMoney(price)}</span>`:''}</div>`;
      });
      document.getElementById('addon-list').innerHTML=html;
      if(parseFloat(data.addonTotal)>0){
        document.getElementById('addon-total-row').style.display='flex';
        document.getElementById('addon-total-val').textContent=fmtMoney(data.addonTotal);
      }
    }
  }

  document.getElementById('order-info').innerHTML=`
    <div class="order-row"><span class="lbl">車主姓名</span><span class="val">${data.name||'—'}</span></div>
    <div class="order-row"><span class="lbl">手機號碼</span><span class="val">${data.phone||'—'}</span></div>
    <div class="order-row"><span class="lbl">車種類型</span><span class="val">${data.vehicleType||'—'}</span></div>
    <div class="order-row"><span class="lbl">車款</span><span class="val">${data.model||'—'}</span></div>
    <div class="order-row"><span class="lbl">顏色</span><span class="val">${data.color||'—'}</span></div>
    <div class="order-row"><span class="lbl">電池</span><span class="val">${[data.batType,data.batV,data.batAh].filter(Boolean).join(' ')||'—'}</span></div>
    <div class="order-row"><span class="lbl">車輛備註</span><span class="val">${data.modelNote||'—'}</span></div>
    <div class="order-row"><span class="lbl">總金額</span><span class="val">${fmtMoney(data.total)}</span></div>
    <div class="order-row"><span class="lbl">已付訂金</span><span class="val">${fmtMoney(data.deposit)}</span></div>
    <div class="order-row"><span class="lbl">應收尾款</span><span class="val">${fmtMoney(data.balance)}</span></div>`;
}

function goBack(){
  document.getElementById('step2').style.display='none';
  document.getElementById('step1').style.display='block';
  setStep(1);
  window.scrollTo({top:0,behavior:'smooth'});
}

function confirmDelivery(){
  hideErr('err2');
  if(!orderData) return;

  const frame=document.getElementById('d-frame').value.trim();
  const motor=document.getElementById('d-motor').value.trim();
  const plate=document.getElementById('d-plate').value.trim();
  const deliveryDate=document.getElementById('d-delivery-date').value || new Date().toISOString().split('T')[0];
  const bal=parseFloat(orderData.balance)||0;

  if(!frame) return showErr('err2','請填寫車架號碼');
  if(!deliveryDate) return showErr('err2','請填寫實際交車日');

  // 尾款驗證
  if(bal>0){
    const details=getBalDetails();
    const filled=details.filter(d=>d.method&&d.amount>0);
    if(filled.length===0) return showErr('err2','請填寫尾款收款明細');
    if(filled.some(d=>!d.method)) return showErr('err2','請選擇所有付款明細的付款方式');
    if(filled.some(d=>!d.date)) return showErr('err2','請填寫收款日期，方便每日收款統計');
    const sum=filled.reduce((s,d)=>s+d.amount,0);
    if(Math.abs(sum-bal)>=1) return showErr('err2',`付款明細加總（NT$ ${Math.round(sum).toLocaleString()}）與尾款金額（NT$ ${Math.round(bal).toLocaleString()}）不符`);
  }

  // 組合送出資料
  const details=getBalDetails().filter(d=>d.method&&d.amount>0);
  const balMethod=details.length===0?'':details.length===1?details[0].method:'多元付款';
  const balDate=details.length>0?details[0].date:'';
  const balanceDetail=details.length>1?details.map(x=>`${x.method}:${x.amount}:${x.date}`).join('｜'):'';

  const msg=bal>0
    ?`確認交車？\n\n應收尾款：${fmtMoney(bal)}\n付款方式：${balMethod}\n\n請確認已收款後送出。`
    :`確認交車？\n\n此訂單已完款，確認送出？`;
  if(!confirm(msg)) return;

  const btn=document.querySelector('#step2 .btn-green');
  btn.disabled=true; btn.textContent='處理中...';

  const cbName='cb_'+Date.now();
  window[cbName]=function(data){
    delete window[cbName]; script.remove();
    if(data.status==='ok'){
      document.getElementById('step2').style.display='none';
      document.getElementById('done-screen').style.display='block';
      setStep(3);
      document.getElementById('done-info').innerHTML=`
        <div class="done-info-row"><span class="lbl">車主</span><span class="val">${orderData.name}</span></div>
        <div class="done-info-row"><span class="lbl">車款</span><span class="val">${orderData.model}</span></div>
        <div class="done-info-row"><span class="lbl">車架號碼</span><span class="val">${frame}</span></div>
        ${plate?`<div class="done-info-row"><span class="lbl">車牌</span><span class="val">${plate}</span></div>`:''}
        <div class="done-info-row"><span class="lbl">實際交車日</span><span class="val">${deliveryDate}</span></div>
        <div class="done-info-row"><span class="lbl">尾款</span><span class="val">${fmtMoney(bal)}</span></div>
        ${balMethod?`<div class="done-info-row"><span class="lbl">付款方式</span><span class="val">${balMethod}</span></div>`:''}
        <div class="done-info-row"><span class="lbl">交車日期</span><span class="val">${balDate||'—'}</span></div>`;
      window.scrollTo({top:0,behavior:'smooth'});
    } else {
      showErr('err2','送出失敗：'+(data.message||'請稍後再試'));
      btn.disabled=false; btn.textContent='✅ 確認交車完成';
    }
  };
  const script=document.createElement('script');
  script.src=`${SCRIPT_URL}?action=delivery&orderId=${encodeURIComponent(orderData.id)}`
    +`&frame=${encodeURIComponent(frame)}&motor=${encodeURIComponent(motor)}`
    +`&plate=${encodeURIComponent(plate)}&balDate=${encodeURIComponent(balDate)}`
    +`&balMethod=${encodeURIComponent(balMethod)}`
    +`&balanceDetail=${encodeURIComponent(balanceDetail)}`
    +`&deliveryDate=${encodeURIComponent(deliveryDate)}`
    +`&callback=${cbName}`;
  script.onerror=()=>{showErr('err2','網路異常，請再試一次');btn.disabled=false;btn.textContent='✅ 確認交車完成';};
  document.body.appendChild(script);
  setTimeout(()=>{
    if(window[cbName]){delete window[cbName];script.remove();showErr('err2','送出逾時，請再試一次');btn.disabled=false;btn.textContent='✅ 確認交車完成';}
  },12000);
}
</script>
